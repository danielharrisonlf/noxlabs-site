# noxlabs.tech: site estático gerado pelo Astro.
# TLS termina no proxy à frente (Traefik do Dokploy); aqui é HTTP na porta 80.

map $sent_http_content_type $nox_cache {
  default                    "no-cache";
  ~*text/html                "no-cache";
  ~*font/                    "public, max-age=2592000";
  ~*image/                   "public, max-age=604800";
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/xml application/javascript text/javascript
             application/json application/manifest+json image/svg+xml;

  # CSP com o hash de cada script inline, gerada no build por scripts/csp.mjs.
  include /etc/nginx/snippets/csp.conf;

  # Cabeçalhos de segurança (repetidos em cada location que usa add_header).
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cache-Control $nox_cache always;

  # Arquivos com hash no nome (Astro): cache de um ano.
  location /_astro/ {
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # /casos/kairos e /casos/kairos/ servem /casos/kairos/index.html; o resto cai no 404 do site.
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
  }
}
